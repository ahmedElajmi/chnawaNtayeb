    <!-- Apply the last used theme before first paint (avoids a flash of the wrong colors) -->
    <script>
      (function () {
        try {
          var snap = JSON.parse(localStorage.getItem('chnowa_active_theme_vars_v1') || 'null');
          if (!snap || typeof snap !== 'object') return;
          var root = document.documentElement;
          var vars = snap.vars || {};
          for (var k in vars) {
            if (/^--(color|font)-[a-z-]+$/.test(k) && typeof vars[k] === 'string' && vars[k].length < 120) {
              root.style.setProperty(k, vars[k]);
            }
          }
          if (snap.dark) root.classList.add('dark');
          if (/^(rounded|arch|square)$/.test(snap.cardShape)) root.setAttribute('data-card-shape', snap.cardShape);
          if (/^(none|zellige|dots|waves)$/.test(snap.pattern)) root.setAttribute('data-pattern', snap.pattern);
        } catch (e) {}
      })();
    </script>
